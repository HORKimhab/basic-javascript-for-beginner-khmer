<script>
  const dataArray = [22, 12, 45, 1992, 2008]; 
  const sumData = dataArray.reduce((acc, cur, index, arr) => {
    console.log('---More about param reduce---'); 
    console.log(`acc: ${acc}, cur: ${cur}, index: ${index}, arr: ${arr}`);

    return acc + cur; 
  }, 0)

  console.log(`sumData: ${sumData}`);
</script>
